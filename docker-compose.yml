services:
  database:
    image: postgres:16-alpine
    container_name: orbitos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: orbitos_user
      POSTGRES_PASSWORD: orbitos_password
      POSTGRES_DB: orbitos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbitos_user -d orbitos_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - orbitos-net

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: orbitos_backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://orbitos_user:orbitos_password@database:5432/orbitos_db
      - NASA_API_KEY=${NASA_API_KEY:-DEMO_KEY}
    ports:
      - "8000:8000"
    command: sh -c "python -m app.cli --seed-demo && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - orbitos-net

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: orbitos_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - orbitos-net

volumes:
  postgres_data:
    driver: local

networks:
  orbitos-net:
    driver: bridge

